# PAE · versión web — configuración de Apache
# Copiar a /etc/httpd/conf/extra/pae-web.conf y agregar al final de
# /etc/httpd/conf/httpd.conf la línea:
#     Include conf/extra/pae-web.conf
# Requiere mod_headers (en Arch viene activado: revisa que la línea
# "LoadModule headers_module modules/mod_headers.so" no tenga # al inicio).

AddType application/manifest+json .webmanifest

<Directory "/srv/http/portal">
    Options -Indexes
    AllowOverride None
    Require all granted

    # Política de seguridad de contenido (CSP):
    #  - Solo se ejecuta JavaScript de este mismo servidor; un script inyectado no corre.
    #  - connect-src permite la API (mismo servidor) y los servidores de video de Agora (https/wss).
    #  - frame-ancestors 'none' impide meter PAE dentro de otra página (clickjacking).
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=()"

    # El navegador revisa con el servidor si hay versión nueva en cada visita
    # (si no cambió, no la vuelve a descargar). Así las actualizaciones llegan solas.
    Header set Cache-Control "no-cache"
</Directory>
